# ─── General ───────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl
set -ag terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl colors

set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# ─── Prefix ────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ─── Splits ────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps cwd
bind c new-window -c "#{pane_current_path}"

# ─── Navigation (vim-style) ───────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# ─── Quick window select (prefix + a/s/d/f/g → windows 1-5) ──────
bind a select-window -t 1
bind s select-window -t 2
bind d select-window -t 3
bind v select-window -t 4
bind g select-window -t 5

# ─── Copy mode (vi) ───────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ─── Quick reload ─────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ─── Colors (catppuccin mocha inspired) ───────────────────────────
# Palette
BG="#1e1e2e"
SURFACE="#313244"
OVERLAY="#45475a"
TEXT="#cdd6f4"
SUBTEXT="#a6adc8"
LAVENDER="#b4befe"
MAUVE="#cba6f7"
PEACH="#fab387"
GREEN="#a6e3a1"
BLUE="#89b4fa"

# ─── Status bar ───────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=$BG,fg=$TEXT"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=$LAVENDER,fg=$BG,bold]  #S #[bg=$BG] "

# Right: date + time
set -g status-right-length 50
set -g status-right "#[fg=$SUBTEXT]%a %b %d  #[fg=$LAVENDER,bold]%H:%M "

# Window tabs
set -g window-status-format "#[fg=$SUBTEXT]  #I:#W "
set -g window-status-current-format "#[bg=$SURFACE,fg=$LAVENDER,bold]  #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=$OVERLAY"
set -g pane-active-border-style "fg=$LAVENDER"

# Message / command prompt
set -g message-style "bg=$SURFACE,fg=$PEACH,bold"
set -g mode-style "bg=$OVERLAY,fg=$LAVENDER"

# ─── Sessionizer ──────────────────────────────────────────────────
bind f display-popup -E "tmux-sessionizer"

# ─── Plugins (TPM) ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # prefix + Ctrl-s to save, prefix + Ctrl-r to restore
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto-save every 15 min
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
